name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: fmt / validate / tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3.1.2
        with:
          terraform_version: 1.9.8

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6  # v4.1.1
        with:
          tflint_version: v0.53.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: shellcheck scripts, node health check and job examples
        run: shellcheck scripts/*.sh modules/cluster/files/*.sh examples/*.sbatch examples/*/*.sbatch examples/*/*.sh

  hpl:
    name: HPL builds and passes (Rocky Linux 9)
    runs-on: ubuntu-latest
    container: quay.io/rockylinux/rockylinux:9.8
    env:
      # Open MPI inside a container: no cross-memory attach, root allowed, more ranks than cores
      OMPI_MCA_btl_vader_single_copy_mechanism: none
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: The packages the cluster nodes install
        run: |
          dnf install -y dnf-plugins-core epel-release
          dnf config-manager --set-enabled crb
          dnf install -y openmpi-devel openblas-devel gcc make environment-modules tar gzip

      - name: Build with the example script
        run: bash examples/hpl/build-hpl.sh /opt/hpl

      - name: Run a small HPL and require the residual check to pass
        run: |
          . /etc/profile.d/modules.sh
          module load mpi/openmpi-x86_64
          mkdir -p /tmp/hpl && cd /tmp/hpl
          "$GITHUB_WORKSPACE/examples/hpl/hpl-dat.sh" 4000 192 1 2 > HPL.dat
          OPENBLAS_NUM_THREADS=1 mpirun --oversubscribe -np 2 /opt/hpl/bin/xhpl | tee hpl.log
          grep -E '^WR' hpl.log
          grep -q PASSED hpl.log

  nccl-tests:
    name: nccl-tests compiles (CUDA 13, Rocky Linux 9)
    runs-on: ubuntu-latest
    container: nvidia/cuda:13.5.0-devel-rockylinux9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: NCCL and Open MPI (the GPU nodes install the same)
        run: dnf install -y libnccl-devel openmpi-devel environment-modules make tar gzip

      - name: Build with the example script (compiling needs no GPU)
        env:
          NVCC_GENCODE: -gencode=arch=compute_86,code=sm_86
        run: bash examples/nccl/build-nccl-tests.sh /opt/nccl-tests

      - name: The benchmarks exist
        run: |
          ls -l /opt/nccl-tests
          test -x /opt/nccl-tests/all_reduce_perf

  security:
    name: checkov / gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: checkov
        uses: bridgecrewio/checkov-action@a32f8b5c5c7c958bc38947c65dfe139debaf0607  # v12.3140.0
        with:
          directory: .
          config_file: .checkov.yaml
          output_format: cli,sarif
          output_file_path: console,results.sarif

      - name: upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: results.sarif
          category: checkov
